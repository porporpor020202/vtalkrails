<!doctype html><html lang="ko"><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#eef2e9;color:#234b3d;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
.brand{position:absolute;top:55px;left:0;width:100%;text-align:center;font-size:25px;font-weight:500;letter-spacing:-.5px;color:#7c8c70}
