default: &default
  recipient_limit: 20
  candidate_batch_size: 500
  reserve_multiplier: 3
  activity_decay_hours: 24
  response_window_hours: 24
  history_days: 30
  response_prior_successes: 2
  response_prior_failures: 2
  max_pending_conversations: 3
  pending_penalty_exponent: 1.5
  exposure_penalty_scale: 10
  recency_floor: 0.15
  response_floor: 0.25
  availability_floor: 0.5
  activity_min_samples: 12
  awake_hour_start: 8
  awake_hour_end: 23

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
