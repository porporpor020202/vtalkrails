      "privacy_intro": "Say One Thing 是每天录制一句英语的个人练习服务。",
      "data_heading": "存储的信息",
      "data_body": "我们存储登录服务商的账号标识和邮箱、母语、登录会话、每日问题和录音以及完成日期与时间。完成日期按韩国时间计算。登录前，所选语言也会存储在此设备的 Cookie 中。 我们存储免费试用日期和当天的 AI 回复，不存储输入原文，并每天清理往日回复。为防止重新注册等重复试用，删除账号后保留试用日期及标识，但删除 AI 回复。标识根据账号信息、设备 Cookie 或 IP 地址生成，原始值不存储在这些记录中。 我们还会保存分享奖励的使用时间以及额外练习的问题和录音。 我们会将练习的英语句子与录音一起保存。",
