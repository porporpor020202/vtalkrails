      "data_heading": "Información que guardamos",
      "data_body": "Guardamos el ID y correo del proveedor de acceso, tu lengua materna, sesiones, preguntas y grabaciones diarias, y fechas y horas de finalización. Las fechas usan la hora de Corea. El idioma elegido también se guarda en una cookie de este dispositivo antes de iniciar sesión. Guardamos los días de prueba y las respuestas de IA del día. No guardamos el texto original; las respuestas de días anteriores se eliminan a diario. Tras eliminar la cuenta conservamos días de uso e identificadores para evitar pruebas repetidas, pero borramos las respuestas. Los identificadores se generan a partir de la cuenta del proveedor de acceso, una cookie o la IP; no guardamos sus valores originales en estos registros.",
