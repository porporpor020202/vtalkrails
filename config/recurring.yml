production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  clear_old_ai_responses:
    command: "AiUsage.clear_old_responses!"
    schedule: every day at 12:15am Asia/Seoul

  clear_old_marketing_events:
    command: "MarketingEvent.prune!"
    schedule: every day at 3:30am Asia/Seoul
